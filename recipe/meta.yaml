{% set name = "captum" %}
{% set version = "0.9.0" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/meta-pytorch/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 1572593c2582dbf0d1c1408d1f43ca99321cd61bc7a9f908e459fe20c80989c2

build:
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.0
  run:
    - python
    - matplotlib-base
    - numpy
    - packaging
    - pytorch >=2.3
    - tqdm

# E   AssertionError: tensor(6) != 0
{% set deselect_tests = " --deselect=tests/influence/_core/test_tracin_regression.py::TestTracInRegression::test_tracin_identity_regression_9_check_idx_none_ArnoldiInfluenceFunction" %}

test:
  source_files:
    - tests
  imports:
    - captum
    - captum._utils
  commands:
    - pip check
    - pytest -v tests {{ deselect_tests }}
  requires:
    - pip
    - pytest
    - sphinx
    - mypy
    - scikit-learn
    - parameterized
    - flask
    - flask-compress
    - openai

about:
  home: https://captum.ai
  summary: Model interpretability for PyTorch
  dev_url: https://github.com/pytorch/captum
  license: BSD-3-Clause
  license_file: LICENSE
  license_family: BSD
  description: |
    Captum is a model interpretability and understanding library for PyTorch.
    Captum means comprehension in Latin and contains general purpose
    implementations of integrated gradients, saliency maps, smoothgrad,
    vargrad and others for PyTorch models. It has quick integration for models
    built with domain-specific libraries such as torchvision, torchtext, and others.

    *Captum is currently in beta and under active development!*

    PyPI: [https://pypi.org/project/captum/](https://pypi.org/project/captum/)

  doc_url: https://captum.ai
  dev_url: https://github.com/pytorch/captum

extra:
  recipe-maintainers:
    - sugatoray
    # Maintainers from package repo
    - NarineK
    - aobo-y
    - vivekmig
